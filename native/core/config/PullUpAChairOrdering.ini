[General]
; auto, en, zh. Names of dishes and inns follow the game and its translations.
Language=en
; Unknown food models are excluded until added to foods.tsv.
VerboseLogging=0

[Menu]
; auto follows optional Scene Director / Cinematic Conversation Camera settings.
; LetterboxHeight is thousandths per bar; omit to auto-detect.
ScalePercent=100


[Call]
; 0 = dedicated hotkey, 1 = Dynamic Activation Key, 2 = SkyPrompt
; 0 = unbound; configure in SKSE Menu Framework

Mode=0
Hotkey=0
ShowHotkeyHint=1
PromptUsesHotkey=0
PrioritizeService=1
AutoClearBeforeTalk=1
ClearAllTableItems=0
HideClearTableDialogue=0
HideRestoreTableDialogue=0
[Sounds]
; Recorded page flip and table-service bell. Each bell press plays one one-shot.
PageTurnEnabled=1
PageTurnVolumePercent=100
ServiceBellEnabled=1
ServiceBellVolumePercent=100

[Serving]
; Optional compact main servings. Disabled by default.
; Soup bowl size (14); medium (18); large (22); valid range 8-40.
; Independent dessert/side option, including cheese.
TargetMainDiameter=14.000000
CompactMainDishes=0
TargetDessertDiameter=14.000000
CompactDesserts=0
